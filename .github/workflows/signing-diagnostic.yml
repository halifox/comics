name: Diagnose Android signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android certificate output
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gh release download v1.1.0 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import os
          import base64
          import hashlib
          import re
          from pathlib import Path
          import subprocess
          tools = sorted(Path(os.environ["ANDROID_HOME"]).glob("build-tools/*/apksigner"))
          os.umask(0o077)
          keystore = Path(os.environ["RUNNER_TEMP"]) / "key.jks"
          keystore.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          apk = Path(os.environ["RUNNER_TEMP"]) / "app-release.apk"
          signed = apk.with_name("signed.apk")
          try:
              subprocess.run([
                  str(tools[-1]), "sign", "--ks", str(keystore),
                  "--ks-key-alias", os.environ["ANDROID_KEY_ALIAS"],
                  "--ks-pass", "env:ANDROID_KEYSTORE_PASSWORD",
                  "--key-pass", "env:ANDROID_KEY_PASSWORD",
                  "--out", str(signed), str(apk),
              ], check=True, capture_output=True)
              certificate = subprocess.run([
                  "keytool", "-exportcert", "-keystore", str(keystore),
                  "-alias", os.environ["ANDROID_KEY_ALIAS"],
                  "-storepass:env", "ANDROID_KEYSTORE_PASSWORD",
              ], check=True, capture_output=True).stdout
              expected = hashlib.sha256(certificate).hexdigest()
              for tool in tools:
                  result = subprocess.run([
                      str(tool), "verify", "--verbose", "--print-certs", str(signed),
                  ], check=True, capture_output=True, text=True)
                  actual = re.findall(r"^.*certificate SHA-256 digest: ([0-9a-fA-F]{64})\s*$", result.stdout, re.MULTILINE)
                  assert {digest.lower() for digest in actual} == {expected}, str(tool)
                  print(f"Verified with {tool.parent.name}: SHA-256 {expected}")
          finally:
              keystore.unlink(missing_ok=True)
          PY
