name: Build Android and iOS

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload assets for (leave empty for build only)
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: comics-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS app without code signing
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build ios --release --no-codesign --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Package unsigned IPA
        working-directory: build/ios/iphoneos
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          /usr/bin/zip -qr comics-ios-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: comics-ios-unsigned
          path: build/ios/iphoneos/comics-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: comics-android-arm64
          path: release

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v8
        with:
          name: comics-ios-unsigned
          path: release

      - name: Publish release with build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
