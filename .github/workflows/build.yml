name: Build Android and iOS

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload assets for (leave empty for build only)
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = (
              "ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_PASSWORD", "ANDROID_KEY_ALIAS",
          )
          if any(not os.environ.get(name) for name in names):
              raise SystemExit("Missing Android release signing secrets")
          os.umask(0o077)
          keystore = Path(os.environ["RUNNER_TEMP"]) / "android-release.jks"
          keystore.write_bytes(base64.b64decode(os.environ[names[0]], validate=True))

          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace("=", "\\=").replace(":", "\\:").replace(" ", "\\ ")

          properties = {
              "storeFile": str(keystore),
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in properties.items())
          )
          PY

      - name: Build APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Verify Android release signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess

          certificate = subprocess.run([
              "keytool", "-exportcert", "-keystore",
              str(Path(os.environ["RUNNER_TEMP"]) / "android-release.jks"),
              "-alias", os.environ["ANDROID_KEY_ALIAS"],
              "-storepass:env", "ANDROID_KEYSTORE_PASSWORD",
          ], check=True, capture_output=True).stdout
          expected = hashlib.sha256(certificate).hexdigest()
          tools = sorted(Path(os.environ["ANDROID_HOME"]).glob("build-tools/*/apksigner"))
          if not tools:
              raise SystemExit("Android APK signature verifier unavailable")
          verified = subprocess.run([
              str(tools[-1]), "verify", "--verbose", "--print-certs",
              "build/app/outputs/flutter-apk/app-release.apk",
          ], check=True, capture_output=True, text=True)
          actual = re.findall(r"Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)", verified.stdout)
          if [digest.lower() for digest in actual] != [expected]:
              raise SystemExit("APK does not match the configured release signing certificate")
          print(f"Verified release signing certificate SHA-256: {expected}")
          PY

      - name: Remove Android signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/android-release.jks"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: comics-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS app without code signing
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build ios --release --no-codesign --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Package unsigned IPA
        working-directory: build/ios/iphoneos
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          /usr/bin/zip -qr comics-ios-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: comics-ios-unsigned
          path: build/ios/iphoneos/comics-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: comics-android-arm64
          path: release

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v8
        with:
          name: comics-ios-unsigned
          path: release

      - name: Publish release with build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
